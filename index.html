<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator - Pro Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep: #161c26;
    --navy-panel: #202836;
    --slate: #2c3646;
    --slate-light: #3a4657;
    --amber: #ffb454;
    --amber-dim: #8a6a3a;
    --orange: #ff8c5a;
    --ice: #e8ecf1;
    --ice-dim: #8b95a5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 15%, #1e2632 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #1a2734 0%, transparent 50%),
      var(--navy-deep);
    font-family: 'Sora', sans-serif;
    padding: 24px;
  }

  .calc-container {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .calc {
    width: 340px;
    background: linear-gradient(160deg, #232c3b 0%, #1b2330 100%);
    border-radius: 28px;
    padding: 22px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 -1px 0 rgba(0,0,0,0.5) inset;
    position: relative;
  }

  .calc::before {
    content: '';
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 36px; height: 4px;
    border-radius: 4px;
    background: var(--slate);
    opacity: 0.6;
  }

  .brand {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 6px 16px;
    color: var(--ice-dim);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .brand span:last-child { color: var(--amber-dim); }

  .display {
    background: #10151d;
    border-radius: 16px;
    padding: 24px 18px 18px;
    margin-bottom: 18px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.03);
    position: relative;
    overflow: hidden;
  }

  .display::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }

  .prev-line {
    min-height: 18px;
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--ice-dim);
    letter-spacing: 1px;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
  }
  .prev-line::-webkit-scrollbar { display: none; }

  .main-line {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 42px;
    color: var(--amber);
    text-shadow: 0 0 18px rgba(255,180,84,0.45), 0 0 2px rgba(255,180,84,0.6);
    letter-spacing: 1px;
    margin-top: 6px;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
  }
  .main-line::-webkit-scrollbar { display: none; }

  .pad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    border: none;
    border-radius: 14px;
    height: 52px;
    font-family: 'Sora', sans-serif;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    color: var(--ice);
    background: linear-gradient(160deg, var(--slate-light) 0%, var(--slate) 100%);
    box-shadow:
      0 3px 0 rgba(0,0,0,0.35),
      0 1px 0 rgba(255,255,255,0.06) inset;
    transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.15s ease;
    position: relative;
  }

  button:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.03) inset;
  }

  .op {
    background: linear-gradient(160deg, #3a4560 0%, #2a3348 100%);
    color: var(--amber);
  }

  .equals {
    background: linear-gradient(160deg, #ff9d63 0%, var(--orange) 100%);
    color: #2a1608;
    box-shadow:
      0 3px 0 #b85c2e,
      0 1px 0 rgba(255,255,255,0.25) inset;
  }
  .equals:active {
    box-shadow: 0 0 0 #b85c2e, 0 1px 0 rgba(255,255,255,0.1) inset;
  }

  .func {
    color: var(--ice-dim);
    font-size: 15px;
  }

  .sci {
    background: linear-gradient(160deg, #2b384a 0%, #1f2a38 100%);
    color: var(--amber);
    font-size: 14px;
  }

  .zero { grid-column: span 2; }

  /* History Panel */
  .history-panel {
    width: 220px;
    background: linear-gradient(160deg, #232c3b 0%, #1b2330 100%);
    border-radius: 28px;
    padding: 22px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 1px 0 rgba(255,255,255,0.04) inset;
    display: flex;
    flex-direction: column;
    max-height: 480px;
  }

  .history-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--ice-dim);
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .clear-history {
    background: none;
    border: none;
    color: var(--amber-dim);
    font-size: 10px;
    cursor: pointer;
    box-shadow: none;
    height: auto;
    padding: 0;
  }
  .clear-history:hover { color: var(--amber); }

  .history-list {
    overflow-y: auto;
    flex-grow: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--slate) transparent;
  }

  .history-item {
    background: #10151d;
    padding: 8px 10px;
    border-radius: 10px;
    color: var(--ice-dim);
    text-align: right;
  }

  .history-expr { font-size: 11px; opacity: 0.7; }
  .history-res { color: var(--amber); font-weight: 700; margin-top: 2px; }

  @media (max-width: 600px) {
    .calc-container { flex-direction: column; align-items: center; }
    .history-panel { width: 340px; max-height: 200px; }
  }
</style>
</head>
<body>

<div class="calc-container">
  <div class="calc">
    <div class="brand">
      <span>MK-7 Pro</span>
      <span>SOLAR</span>
    </div>

    <div class="display">
      <div class="prev-line" id="prevLine">&nbsp;</div>
      <div class="main-line" id="mainLine">0</div>
    </div>

    <div class="pad">
      <!-- Scientific Row -->
      <button class="sci" onclick="applySci('sqrt')">&radic;x</button>
      <button class="sci" onclick="applySci('sqr')">x&sup2;</button>
      <button class="sci" onclick="chooseOp('^')">x^y</button>
      <button class="func" onclick="percent()">%</button>

      <!-- Standard Controls -->
      <button class="func" onclick="clearAll()">AC</button>
      <button class="func" onclick="toggleSign()">+/-</button>
      <button class="func" onclick="backspace()">&#9003;</button>
      <button class="op" onclick="chooseOp('÷')">&divide;</button>

      <button onclick="inputDigit('7')">7</button>
      <button onclick="inputDigit('8')">8</button>
      <button onclick="inputDigit('9')">9</button>
      <button class="op" onclick="chooseOp('&times;')">&times;</button>

      <button onclick="inputDigit('4')">4</button>
      <button onclick="inputDigit('5')">5</button>
      <button onclick="inputDigit('6')">6</button>
      <button class="op" onclick="chooseOp('&minus;')">&minus;</button>

      <button onclick="inputDigit('1')">1</button>
      <button onclick="inputDigit('2')">2</button>
      <button onclick="inputDigit('3')">3</button>
      <button class="op" onclick="chooseOp('+')">+</button>

      <button class="zero" onclick="inputDigit('0')">0</button>
      <button onclick="inputDot()">.</button>
      <button class="equals" onclick="equals()">=</button>
    </div>
  </div>

  <div class="history-panel">
    <div class="history-title">
      <span>History</span>
      <button class="clear-history" onclick="clearHistory()">Clear</button>
    </div>
    <div class="history-list" id="historyList">
      <div style="color: var(--ice-dim); text-align: center; font-size: 12px; margin-top: 20px;">No history yet</div>
    </div>
  </div>
</div>

<script>
  let current = '0';
  let previous = null;
  let operator = null;
  let overwrite = true;
  let history = [];

  const mainLine = document.getElementById('mainLine');
  const prevLine = document.getElementById('prevLine');
  const historyList = document.getElementById('historyList');

  function updateDisplay() {
    mainLine.textContent = formatNum(current);
    prevLine.textContent = previous !== null && operator
      ? `${formatNum(previous)} ${operator}`
      : '\u00a0';
  }

  function formatNum(numStr) {
    if (numStr === 'Error') return numStr;
    let [intPart, decPart] = numStr.split('.');
    const neg = intPart.startsWith('-');
    if (neg) intPart = intPart.slice(1);
    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    let result = (neg ? '-' : '') + intPart;
    if (decPart !== undefined) result += '.' + decPart;
    return result;
  }

  function inputDigit(d) {
    if (overwrite) {
      current = d;
      overwrite = false;
    } else {
      if (current.replace('-', '').replace('.', '').length >= 12) return;
      current = current === '0' ? d : current + d;
    }
    updateDisplay();
  }

  function inputDot() {
    if (overwrite) {
      current = '0.';
      overwrite = false;
    } else if (!current.includes('.')) {
      current += '.';
    }
    updateDisplay();
  }

  function toggleSign() {
    if (current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
    updateDisplay();
  }

  function percent() {
    current = String(parseFloat(current) / 100);
    updateDisplay();
  }

  function backspace() {
    if (overwrite) return;
    current = current.length > 1 ? current.slice(0, -1) : '0';
    updateDisplay();
  }

  function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    overwrite = true;
    updateDisplay();
  }

  function chooseOp(op) {
    if (operator && !overwrite) {
      equals();
    }
    previous = current;
    operator = op;
    overwrite = true;
    updateDisplay();
  }

  function applySci(func) {
    let val = parseFloat(current);
    let res;
    let exprStr = '';

    if (func === 'sqrt') {
      if (val < 0) {
        current = 'Error';
        updateDisplay();
        return;
      }
      res = Math.sqrt(val);
      exprStr = `√(${val})`;
    } else if (func === 'sqr') {
      res = val * val;
      exprStr = `(${val})²`;
    }

    current = trimResult(res);
    overwrite = true;
    updateDisplay();
    addHistory(exprStr, current);
  }

  function compute(a, b, op) {
    a = parseFloat(a);
    b = parseFloat(b);
    switch (op) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
      case '^': return Math.pow(a, b);
      default: return b;
    }
  }

  function equals() {
    if (operator === null || previous === null) return;
    const exprText = `${formatNum(previous)} ${operator} ${formatNum(current)}`;
    const result = compute(previous, current, operator);
    const finalRes = isNaN(result) ? 'Error' : trimResult(result);
    
    if (finalRes !== 'Error') {
      addHistory(exprText, finalRes);
    }

    current = finalRes;
    previous = null;
    operator = null;
    overwrite = true;
    updateDisplay();
  }

  function trimResult(n) {
    if (!isFinite(n)) return 'Error';
    let s = n.toFixed(8).replace(/0+$/, '').replace(/\.$/, '');
    if (s.replace('-', '').replace('.', '').length > 12) {
      s = n.toPrecision(10);
      s = parseFloat(s).toString();
    }
    return s;
  }

  function addHistory(expr, res) {
    history.unshift({ expr, res });
    if (history.length > 20) history.pop();
    renderHistory();
  }

  function renderHistory() {
    if (history.length === 0) {
      historyList.innerHTML = '<div style="color: var(--ice-dim); text-align: center; font-size: 12px; margin-top: 20px;">No history yet</div>';
      return;
    }
    historyList.innerHTML = history.map(h => `
      <div class="history-item">
        <div class="history-expr">${h.expr}</div>
        <div class="history-res">${h.res}</div>
      </div>
    `).join('');
  }

  function clearHistory() {
    history = [];
    renderHistory();
  }

  // Keyboard support
  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
    else if (e.key === '.') inputDot();
    else if (e.key === '+') chooseOp('+');
    else if (e.key === '-') chooseOp('−');
    else if (e.key === '*') chooseOp('×');
    else if (e.key === '/') { e.preventDefault(); chooseOp('÷'); }
    else if (e.key === '^') chooseOp('^');
    else if (e.key === 'Enter' || e.key === '=') equals();
    else if (e.key === 'Backspace') { e.preventDefault(); backspace(); }
    else if (e.key === 'Escape') clearAll();
  });

  updateDisplay();
</script>

</body>
</html>
